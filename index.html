<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --accent: #5b8cff;
  --button-size: 46px;
  --radius: 18px;
  --carousel-height: clamp(260px, 56vw, 560px);
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent !important;
  overflow: hidden;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

.carousel-embed {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  background: transparent !important;
  isolation: isolate;
  line-height: 0;
}

.carousel {
  position: relative;
  width: 100%;
  height: var(--carousel-height);
  overflow: hidden;
  border-radius: var(--radius);
  background: transparent !important;
  user-select: none;
  touch-action: pan-y;
}

.track {
  height: 100%;
  display: flex;
  background: transparent !important;
  transition: transform 360ms cubic-bezier(.22,.9,.25,1);
  will-change: transform;
}

.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  background: transparent !important;
}

.slide img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 0;
  pointer-events: none;
  -webkit-user-drag: none;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  z-index: 5;
  width: var(--button-size);
  height: var(--button-size);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;
  padding: 0;
  transform: translateY(-50%);
  background: rgba(5,10,30,.58);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  display: grid;
  place-items: center;
  line-height: 1;
}

.carousel-btn:hover {
  background: rgba(5,10,30,.76);
}

.carousel-btn svg {
  width: 22px;
  height: 22px;
  fill: #fff;
}

.carousel-btn.prev {
  left: 16px;
}

.carousel-btn.next {
  right: 16px;
}

.dots {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px 0 0;
  margin: 0;
  background: transparent !important;
  line-height: 1;
}

.dot {
  width: 9px;
  height: 9px;
  border: 0;
  border-radius: 999px;
  padding: 0;
  background: rgba(255,255,255,.55);
  cursor: pointer;
}

.dot.active {
  background: var(--accent);
}

@media (max-width: 700px) {
  :root {
    --button-size: 40px;
    --carousel-height: clamp(220px, 62vw, 420px);
  }

  .carousel {
    border-radius: 14px;
  }

  .carousel-btn.prev {
    left: 10px;
  }

  .carousel-btn.next {
    right: 10px;
  }
}
</style>
</head>

<body>
<div class="carousel-embed">
  <div class="carousel" id="carousel" tabindex="0" aria-label="Image carousel">
    <div class="track" id="track"></div>

    <button class="carousel-btn prev" id="prevBtn" type="button" aria-label="Previous image">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </button>

    <button class="carousel-btn next" id="nextBtn" type="button" aria-label="Next image">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
      </svg>
    </button>
  </div>

  <div class="dots" id="dots" aria-label="Carousel navigation"></div>
</div>

<script>
(() => {
  const images = [
    "https://cdn.shopify.com/s/files/1/0055/5525/7434/files/HoFKORD.png?v=1780661490",
    "https://cdn.shopify.com/s/files/1/0055/5525/7434/files/Microsoft_Flight_Simulator_2024_Screenshot_2026.06.01_-_22.06.39.86.png?v=1780661484",
    "https://cdn.shopify.com/s/files/1/0055/5525/7434/files/Microsoft_Flight_Simulator_2024_Screenshot_2026.06.01_-_21.56.14.92.png?v=1780661484",
    "https://cdn.shopify.com/s/files/1/0055/5525/7434/files/Microsoft_Flight_Simulator_2024_Screenshot_2026.06.01_-_22.26.32.54.png?v=1780661484"
  ];

  const carousel = document.getElementById("carousel");
  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let index = 1;
  let locked = false;
  let dragging = false;
  let startX = 0;
  let deltaX = 0;

  function createSlide(src, alt) {
    const slide = document.createElement("div");
    slide.className = "slide";

    const img = document.createElement("img");
    img.src = src;
    img.alt = alt;
    img.loading = "lazy";
    img.decoding = "async";

    slide.appendChild(img);
    return slide;
  }

  function build() {
    track.innerHTML = "";
    dots.innerHTML = "";

    track.appendChild(createSlide(images[images.length - 1], "Carousel image " + images.length));

    images.forEach((src, i) => {
      track.appendChild(createSlide(src, "Carousel image " + (i + 1)));

      const dot = document.createElement("button");
      dot.className = "dot";
      dot.type = "button";
      dot.ariaLabel = "Go to image " + (i + 1);
      dot.addEventListener("click", () => goTo(i + 1));
      dots.appendChild(dot);
    });

    track.appendChild(createSlide(images[0], "Carousel image 1"));

    setPosition(false);
    updateDots();
  }

  function setPosition(animate = true) {
    track.style.transition = animate ? "transform 360ms cubic-bezier(.22,.9,.25,1)" : "none";
    track.style.transform = `translateX(${-index * 100}%)`;
  }

  function updateDots() {
    [...dots.children].forEach(dot => dot.classList.remove("active"));
    const realIndex = (index - 1 + images.length) % images.length;
    dots.children[realIndex]?.classList.add("active");
  }

  function goTo(newIndex) {
    if (locked) return;
    locked = true;
    index = newIndex;
    setPosition(true);
    updateDots();
  }

  function next() {
    if (locked) return;
    locked = true;
    index++;
    setPosition(true);
    updateDots();
  }

  function prev() {
    if (locked) return;
    locked = true;
    index--;
    setPosition(true);
    updateDots();
  }

  track.addEventListener("transitionend", () => {
    if (index === 0) {
      index = images.length;
      setPosition(false);
    }

    if (index === images.length + 1) {
      index = 1;
      setPosition(false);
    }

    updateDots();
    locked = false;
  });

  carousel.addEventListener("pointerdown", e => {
    dragging = true;
    locked = true;
    startX = e.clientX;
    deltaX = 0;
    track.style.transition = "none";
    carousel.setPointerCapture(e.pointerId);
  });

  carousel.addEventListener("pointermove", e => {
    if (!dragging) return;

    deltaX = e.clientX - startX;
    const width = carousel.clientWidth;
    const offset = (-index * width) + deltaX;

    track.style.transform = `translateX(${offset}px)`;
  });

  function endDrag(e) {
    if (!dragging) return;

    dragging = false;

    const threshold = carousel.clientWidth * 0.16;

    if (deltaX < -threshold) index++;
    if (deltaX > threshold) index--;

    setPosition(true);

    try {
      carousel.releasePointerCapture(e.pointerId);
    } catch {}
  }

  carousel.addEventListener("pointerup", endDrag);
  carousel.addEventListener("pointercancel", endDrag);
  carousel.addEventListener("lostpointercapture", endDrag);

  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);

  carousel.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  window.addEventListener("resize", () => setPosition(false));

  build();
})();
</script>
</body>
</html>
